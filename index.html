<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orcus4AI | The Future of Intelligence</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Georgia', serif;
            --color-bg: #0a0a0a;
            --color-card-bg: #151515;
            --color-text-main: #ffffff;
            --color-text-muted: #a0a0a0;
            --color-accent: #00f2ea; /* AI Cyan */
            --spacing-md: 20px;
            --card-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            padding: 20px;
            background: rgba(10, 10, 10, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .brand span { color: var(--color-accent); }
        
        .status-indicator {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #0f0;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- NEWS FEED CONTAINER --- */
        .container {
            max-width: 600px; /* Mobile-focused width like Instagram/TikTok feeds */
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        /* --- CARD DESIGN (MIT TECH REVIEW STYLE) --- */
        .news-card {
            position: relative;
            background-color: var(--color-card-bg);
            border-radius: var(--card-radius);
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .news-card:hover { transform: translateY(-5px); }

        /* Image Container with Overlay */
        .card-image-container {
            position: relative;
            height: 350px; /* Tall, immersive image */
            width: 100%;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        /* Gradient Overlay for Text Readability */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #000000 10%, rgba(0,0,0,0.6) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--color-accent);
        }

        .card-source {
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            color: #fff;
        }

        .card-title {
            font-family: var(--font-main); /* Clean sans-serif headers */
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- BRIEF NOTE SECTION --- */
        .card-body {
            padding: 25px;
            background: #111;
            border-top: 1px solid #222;
        }

        .brief-note-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }

        .bullet-points {
            list-style: none;
        }

        .bullet-points li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #ddd;
            font-family: var(--font-serif); /* Serif for reading text */
        }

        .bullet-points li::before {
            content: "•";
            color: var(--color-accent);
            position: absolute;
            left: 0;
            top: 0px;
            font-size: 1.2rem;
        }

        .read-more-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            background: #222;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .read-more-btn:hover { background: #333; }
        
        .timestamp {
            display: block;
            text-align: right;
            font-size: 0.7rem;
            color: #666;
            margin-top: 10px;
        }

        /* Loader */
        #loader { text-align: center; padding: 50px; color: var(--color-accent); }
    </style>
</head>
<body>

    <header>
        <div class="brand">Orcus<span>4AI</span></div>
        <div class="status-indicator"><div class="dot"></div> Live Feed</div>
    </header>

    <div class="container" id="news-feed">
        <div id="loader">Initializing Neural Feed...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // 1. Get a free API Key from https://gnews.io/
        // 2. Replace 'YOUR_API_KEY_HERE' below. 
        // Note: If you leave it as is, it will show MOCK DATA so you can see the design immediately.
        const API_KEY = 'YOUR_API_KEY_HERE'; 
        const USE_MOCK_DATA = true; // Set to false once you have a real key

        const newsContainer = document.getElementById('news-feed');

        // --- MOCK DATA GENERATOR (For Demo) ---
        const mockNews = [
            {
                title: "OpenAI Announces GPT-5 with 'Human-Level' Reasoning Capabilities",
                description: "The new model demonstrates unprecedented problem-solving skills. Early benchmarks show a 40% increase in coding accuracy. Experts are debating the safety implications of this rapid advancement.",
                image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=1000&auto=format&fit=crop",
                source: "TechCrunch",
                url: "#",
                publishedAt: new Date().toISOString()
            },
            {
                title: "NVIDIA Reveals New Blackwell Chips for AI Training",
                description: "NVIDIA's latest GPU architecture promises 30x faster inference speeds. Major cloud providers have already pre-ordered the first batch. This could significantly reduce the cost of training large language models.",
                image: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1000&auto=format&fit=crop",
                source: "The Verge",
                url: "#",
                publishedAt: new Date().toISOString()
            },
            {
                title: "Robotics Breakthrough: Atlas Robot Now Fully Autonomous",
                description: "Boston Dynamics has released an update allowing Atlas to navigate complex construction sites. The robot can now identify and manipulate tools without human guidance. Commercial availability is expected by 2026.",
                image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?q=80&w=1000&auto=format&fit=crop",
                source: "Wired",
                url: "#",
                publishedAt: new Date().toISOString()
            }
        ];

        // --- HELPER: Convert Description to Bullet Points ---
        // Since APIs give paragraphs, we split sentences to simulate "brief notes".
        function createBulletPoints(text) {
            if (!text) return "<li>No summary available.</li>";
            
            // Split by periods, filter empty strings, take first 3 sentences
            const sentences = text.split('. ').filter(s => s.length > 10).slice(0, 3);
            
            return sentences.map(sentence => {
                // Add period back if missing
                const cleanSentence = sentence.trim().endsWith('.') ? sentence.trim() : sentence.trim() + '.';
                return `<li>${cleanSentence}</li>`;
            }).join('');
        }

        // --- RENDER FUNCTION ---
        function renderNews(articles) {
            newsContainer.innerHTML = ''; // Clear loader

            articles.forEach(article => {
                // Handle missing images
                const imgUrl = article.image || article.urlToImage || 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80';
                const sourceName = article.source.name || article.source || 'Unknown Source';
                const date = new Date(article.publishedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const cardHTML = `
                    <div class="news-card">
                        <div class="card-image-container">
                            <img src="${imgUrl}" alt="News Image" class="card-image">
                            <div class="card-overlay">
                                <div class="card-meta">
                                    <span class="card-source">${sourceName}</span>
                                    <span>• AI & TECH</span>
                                </div>
                                <h2 class="card-title">${article.title}</h2>
                            </div>
                        </div>
                        <div class="card-body">
                            <span class="brief-note-label">Brief Note</span>
                            <ul class="bullet-points">
                                ${createBulletPoints(article.description || article.content)}
                            </ul>
                            <span class="timestamp">Updated: ${date}</span>
                            <a href="${article.url}" target="_blank" class="read-more-btn">Read Full Story</a>
                        </div>
                    </div>
                `;
                newsContainer.innerHTML += cardHTML;
            });
        }

        // --- FETCH DATA ---
        async function fetchNews() {
            if (USE_MOCK_DATA) {
                setTimeout(() => renderNews(mockNews), 800); // Simulate delay
                return;
            }

            try {
                // Using GNews API query for "Artificial Intelligence OR Technology"
                const url = `https://gnews.io/api/v4/search?q="Artificial Intelligence" OR Technology&lang=en&max=10&apikey=${API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.articles) {
                    renderNews(data.articles);
                } else {
                    newsContainer.innerHTML = '<p style="text-align:center; color:#f00;">Error loading news. Check API Key.</p>';
                }
            } catch (error) {
                console.error("Fetch error:", error);
                newsContainer.innerHTML = '<p style="text-align:center">Failed to connect to news stream.</p>';
            }
        }

        // Initialize
        fetchNews();

    </script>
</body>
</html>
